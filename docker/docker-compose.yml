services:
  app:
    container_name: excalispace-app
    image: rodrigodanieli/excalispace:latest
    build:
      context: ..
      dockerfile: docker/Dockerfile
    restart: unless-stopped
    ports:
      - "${APP_PORT:-3001}:3000"
    environment:
      - DATABASE_URL=postgresql://${POSTGRES_USER:-postgres}:${POSTGRES_PASSWORD:-postgres}@db:5432/${POSTGRES_DB:-excalispace}?schema=public
      - NEXTAUTH_SECRET=${NEXTAUTH_SECRET:-excalispace-super-secret-key-change-me-in-production-12345}
      - NEXTAUTH_URL=${NEXTAUTH_URL:-http://localhost:3001}
      - STORAGE_DRIVER=${STORAGE_DRIVER:-local}
      - STORAGE_LOCAL_PATH=${STORAGE_LOCAL_PATH:-/app/public/uploads}
      - SMTP_HOST=${SMTP_HOST:-}
      - SMTP_PORT=${SMTP_PORT:-587}
      - SMTP_USER=${SMTP_USER:-}
      - SMTP_PASSWORD=${SMTP_PASSWORD:-}
      - SMTP_SECURE=${SMTP_SECURE:-false}
      - SMTP_FROM=${SMTP_FROM:-ExcaliSpace <noreply@excalispace.local>}
    depends_on:
      db:
        condition: service_healthy
    volumes:
      - uploads_data:/app/public/uploads
    networks:
      - excalispace-net

  db:
    container_name: excalispace-db
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-postgres}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-postgres}
      POSTGRES_DB: ${POSTGRES_DB:-excalispace}
    volumes:
      - pgdata:/var/lib/postgresql/data
    ports:
      - "${DB_PORT:-5432}:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-postgres} -d ${POSTGRES_DB:-excalispace}"]
      interval: 3s
      timeout: 5s
      retries: 10
    networks:
      - excalispace-net

volumes:
  pgdata:
    name: excalispace_pgdata
  uploads_data:
    name: excalispace_uploads

networks:
  excalispace-net:
    driver: bridge
